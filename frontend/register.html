<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as a Donor</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <div class="container">
            <h1>Blood Donation Management</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register as Donor</a></li>
                <li><a href="search.html">Find Donors</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h2>Donor Registration</h2>
        <form id="registration-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>

            <label for="gender">Gender:</label>
            <input type="text" id="gender" name="gender" required>

            <label for="blood_group">Blood Group:</label>
            <select id="blood_group" name="blood_group" required>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="city">City / Location:</label>
            <input type="text" id="city" name="city" required>

            <label for="last_donation_date">Last Donation Date:</label>
            <input type="date" id="last_donation_date" name="last_donation_date">

            <button type="submit" class="btn">Register</button>
        </form>
        <p id="message"></p>
    </main>

    <footer>
        <p>&copy; 2025 Blood Donation Management</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
