<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Donors</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <div class="container">
            <h1>Blood Donation Management</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register as Donor</a></li>
                <li><a href="search.html">Find Donors</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h2>Find Donors</h2>
        <form id="search-form">
            <label for="blood_group">Blood Group:</label>
            <select id="blood_group" name="blood_group">
                <option value="">All</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label for="city">City / Location:</label>
            <input type="text" id="city" name="city">

            <button type="submit" class="btn">Search</button>
        </form>

        <div id="donor-results">
            <!-- Donor cards will be inserted here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Blood Donation Management</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
